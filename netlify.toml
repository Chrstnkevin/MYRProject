[build]
  command = "npm run build"
  publish = ".next"

[dev]
  command = "npm run dev"
  port = 3000

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Python functions configuration
[functions]
  directory = "netlify/functions"

# Python runtime untuk generate-xls function
[functions.generate-xls]
  runtime = "python3.9"